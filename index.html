<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sort It Out! — The Recycling Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Decorative background layers -->
  <div class="bg-layer bg-layer--dots"></div>
  <div class="bg-layer bg-layer--grain"></div>

  <div id="game-container">

    <!-- ==================== START SCREEN ==================== -->
    <section id="screen-start" class="screen screen--active" aria-label="Start Screen">
      <div class="start-content">
        <div class="logo-wrap">
          <span class="logo-icon" aria-hidden="true">♻️</span>
          <h1 class="game-title">Mrs. Pep's<br><span class="title-accent">Sort It<br>Out!</span></h1>
        </div>
        <p class="tagline">Can you tell trash from treasure?<br>10 items. 10 chances. Zero waste.</p>
        <button id="btn-start" class="btn btn--primary" aria-label="Start the game">
          <span class="btn-text">Let's Go!</span>
          <span class="btn-arrow" aria-hidden="true">→</span>
        </button>
        <button id="btn-view-scores" class="btn btn--scores" aria-label="View high scores">
          <span class="btn-text">🏆 High Scores</span>
        </button>
        <p class="hint">🔊 Sound on for the full experience</p>
      </div>
      <div class="start-deco">
        <div class="deco-bin deco-bin--trash" aria-hidden="true">🗑️</div>
        <div class="deco-bin deco-bin--recycle" aria-hidden="true">♻️</div>
      </div>
    </section>

    <!-- ==================== PLAY SCREEN ==================== -->
    <section id="screen-play" class="screen" aria-label="Game Play">
      <header class="hud">
        <div class="hud-round">
          <span class="hud-label">Round</span>
          <span id="hud-round-num" class="hud-value">1</span>
          <span class="hud-sep">/</span>
          <span class="hud-value">10</span>
        </div>
        <div class="hud-score">
          <span class="hud-label">Score</span>
          <span id="hud-score-num" class="hud-value">0</span>
        </div>
      </header>

      <div class="play-area">
        <div class="item-card" id="item-card">
          <div class="item-card__image-wrap">
            <img id="item-image" src="" alt="" class="item-card__image">
          </div>
          <p id="item-name" class="item-card__name"></p>
        </div>

        <!-- Feedback overlay -->
        <div id="feedback" class="feedback" aria-live="polite">
          <span id="feedback-icon" class="feedback__icon"></span>
          <span id="feedback-text" class="feedback__text"></span>
        </div>
      </div>

      <div class="choices">
        <button id="btn-trash" class="btn-choice btn-choice--trash" aria-label="Put in trash bin">
          <span class="btn-choice__icon" aria-hidden="true">🗑️</span>
          <span class="btn-choice__label">Trash</span>
        </button>
        <button id="btn-recycle" class="btn-choice btn-choice--recycle" aria-label="Put in recycling bin">
          <span class="btn-choice__icon" aria-hidden="true">♻️</span>
          <span class="btn-choice__label">Recycle</span>
        </button>
      </div>
    </section>

    <!-- ==================== END SCREEN ==================== -->
    <section id="screen-end" class="screen" aria-label="Game Over">
      <div class="end-content">
        <h2 id="end-title" class="end-title"></h2>
        <div class="score-ring">
          <svg viewBox="0 0 120 120" class="score-ring__svg">
            <circle cx="60" cy="60" r="52" class="score-ring__bg"/>
            <circle cx="60" cy="60" r="52" class="score-ring__fill" id="score-ring-fill"/>
          </svg>
          <span id="end-score" class="score-ring__number"></span>
        </div>
        <p id="end-message" class="end-message"></p>
        <div id="end-summary" class="end-summary" style="display:none;"></div>

        <!-- High Score Entry -->
        <div id="highscore-entry" class="highscore-entry" style="display:none;">
          <p class="highscore-entry__label">Save your score!</p>
          <div class="highscore-entry__row">
            <input id="player-name-input" class="highscore-entry__input" type="text" maxlength="20" placeholder="Your name…" aria-label="Enter your name">
            <button id="btn-save-score" class="btn btn--forest" aria-label="Save score">Save</button>
          </div>
        </div>

        <button id="btn-replay" class="btn btn--primary" aria-label="Play again">
          <span class="btn-text">Play Again</span>
          <span class="btn-arrow" aria-hidden="true">↺</span>
        </button>

        <!-- Dual High Score Boards -->
        <div id="highscore-boards" class="highscore-boards" style="display:none;">
          <!-- Personal Best (localStorage) -->
          <div class="highscore-board highscore-board--personal">
            <h3 class="highscore-board__title">⭐ Your Best</h3>
            <ol id="personal-best-list" class="highscore-list"></ol>
          </div>
          <!-- Server-side All Scores -->
          <div class="highscore-board highscore-board--global">
            <h3 class="highscore-board__title">🏆 Top Scores</h3>
            <ol id="global-scores-list" class="highscore-list"></ol>
          </div>
        </div>
      </div>
    </section>

  </div><!-- /#game-container -->

  <!-- ==================== HIGH SCORES MODAL ==================== -->
  <div id="scores-modal" class="scores-modal" role="dialog" aria-modal="true" aria-label="High Scores" hidden>
    <div class="scores-modal__backdrop"></div>
    <div class="scores-modal__panel">
      <button id="btn-close-scores" class="scores-modal__close" aria-label="Close high scores">✕</button>
      <h2 class="scores-modal__title">🏆 High Scores</h2>
      <div class="highscore-boards highscore-boards--modal">
        <div class="highscore-board highscore-board--personal">
          <h3 class="highscore-board__title">⭐ Your Best</h3>
          <ol id="modal-personal-best-list" class="highscore-list"></ol>
        </div>
        <div class="highscore-board highscore-board--global">
          <h3 class="highscore-board__title">🌍 Top Scores</h3>
          <ol id="modal-global-scores-list" class="highscore-list"></ol>
        </div>
      </div>
    </div>
  </div>
  <audio class="sound-start" preload="auto" src="assets/sounds/start1.m4a"></audio>
  <audio class="sound-correct" preload="auto" src="assets/sounds/correct1.m4a"></audio>
  <audio class="sound-correct" preload="auto" src="assets/sounds/correct2.m4a"></audio>
  <audio class="sound-correct" preload="auto" src="assets/sounds/correct3.m4a"></audio>
  <audio class="sound-correct" preload="auto" src="assets/sounds/correct4.m4a"></audio>
  <audio class="sound-correct" preload="auto" src="assets/sounds/correct5.m4a"></audio>
  <audio class="sound-correct" preload="auto" src="assets/sounds/correct6.m4a"></audio>
  <audio class="sound-correct" preload="auto" src="assets/sounds/correct7.m4a"></audio>
  <audio class="sound-incorrect" preload="auto" src="assets/sounds/incorrect1.m4a"></audio>
  <audio class="sound-incorrect" preload="auto" src="assets/sounds/incorrect2.m4a"></audio>
  <audio class="sound-incorrect" preload="auto" src="assets/sounds/incorrect3.m4a"></audio>
  <audio class="sound-incorrect" preload="auto" src="assets/sounds/incorrect4.m4a"></audio>
  <audio class="sound-incorrect" preload="auto" src="assets/sounds/incorrect5.m4a"></audio>
  <audio class="sound-end" preload="auto" src="assets/sounds/end_low.m4a"></audio>
  <audio class="sound-end" preload="auto" src="assets/sounds/end_high.m4a"></audio>
  <audio class="sound-end" preload="auto" src="assets/sounds/end_perfect.m4a"></audio>

  <script src="js/game.js"></script>
</body>
</html>
